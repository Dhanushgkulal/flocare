<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Browser Camera Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .video-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #video, #canvas {
            width: 100%;
            display: block;
        }
        
        #video {
            display: none;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .info-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .info-card h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .detections-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .detection-item {
            background: #f7fafc;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
        }
        
        .detection-conf {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .status.active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.inactive {
            background: #fed7d7;
            color: #742a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 YOLO Detection - Browser Camera</h1>
            <p>Using browser camera API (working) + server-side detection</p>
        </header>
        
        <div class="main-content">
            <div class="video-container">
                <div class="canvas-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="controls">
                    <button class="btn-success" id="startBtn" onclick="startCamera()">📷 Start Camera</button>
                    <button class="btn-primary" id="toggleBtn" onclick="toggleDetection()" disabled>⏸ Pause</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="info-card">
                    <h2>📊 Statistics</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <div>FPS</div>
                            <div class="stat-value" id="fps">0</div>
                        </div>
                        <div class="stat-box">
                            <div>Objects</div>
                            <div class="stat-value" id="objectCount">0</div>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <span class="status inactive" id="status">🔴 Stopped</span>
                    </div>
                </div>
                
                <div class="info-card">
                    <h2>🎯 Current Detections</h2>
                    <div class="detections-list" id="detectionsList">
                        <div style="text-align: center; color: #666;">Click "Start Camera"</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let video, canvas, ctx;
        let detectionActive = false;
        let detectionInterval;
        let frameCount = 0;
        let fpsStart = Date.now();
        
        window.onload = function() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
        };
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('toggleBtn').disabled = false;
                    detectionActive = true;
                    updateStatus();
                    startDetection();
                };
            } catch (err) {
                alert('Camera access denied: ' + err.message);
            }
        }
        
        function startDetection() {
            detectionInterval = setInterval(async () => {
                if (!detectionActive) return;
                
                // Draw video frame to canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get image data
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                // Send to server for detection
                try {
                    const response = await fetch('/detect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imageData })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Redraw frame
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // Draw detections
                        data.detections.forEach(det => {
                            const box = det.box;
                            
                            // Draw box
                            ctx.strokeStyle = '#00FF00';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(box.x1, box.y1, box.x2 - box.x1, box.y2 - box.y1);
                            
                            // Draw label
                            const label = `${det.class} ${(det.confidence * 100).toFixed(0)}%`;
                            ctx.fillStyle = '#00FF00';
                            ctx.fillRect(box.x1, box.y1 - 25, ctx.measureText(label).width + 10, 25);
                            ctx.fillStyle = '#000';
                            ctx.font = '16px Arial';
                            ctx.fillText(label, box.x1 + 5, box.y1 - 7);
                        });
                        
                        // Update UI
                        updateDetections(data.detections);
                        document.getElementById('objectCount').textContent = data.count;
                    }
                } catch (err) {
                    console.error('Detection error:', err);
                }
                
                // Update FPS
                frameCount++;
                if (frameCount % 30 === 0) {
                    const fps = 30 / ((Date.now() - fpsStart) / 1000);
                    document.getElementById('fps').textContent = fps.toFixed(1);
                    fpsStart = Date.now();
                }
            }, 100); // 10 FPS
        }
        
        function toggleDetection() {
            detectionActive = !detectionActive;
            document.getElementById('toggleBtn').textContent = detectionActive ? '⏸ Pause' : '▶ Resume';
            updateStatus();
        }
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (detectionActive) {
                statusEl.className = 'status active';
                statusEl.textContent = '🟢 Active';
            } else {
                statusEl.className = 'status inactive';
                statusEl.textContent = '🔴 Paused';
            }
        }
        
        function updateDetections(detections) {
            const list = document.getElementById('detectionsList');
            if (detections.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #666;">No objects detected</div>';
            } else {
                list.innerHTML = detections.map(det => `
                    <div class="detection-item">
                        <span><strong>${det.class}</strong></span>
                        <span class="detection-conf">${(det.confidence * 100).toFixed(0)}%</span>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
