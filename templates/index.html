<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Camera Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .video-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* 4:3 aspect ratio */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #videoFeed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #48bb78;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .info-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .info-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .detections-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .detection-item {
            background: #f7fafc;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .detection-class {
            font-weight: 600;
            color: #2d3748;
        }
        
        .detection-conf {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .class-tag {
            background: #e6fffa;
            color: #234e52;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9em;
            text-align: center;
        }
        
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .status.active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.inactive {
            background: #fed7d7;
            color: #742a2a;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 YOLO Live Detection</h1>
            <p class="subtitle">Real-time object detection from your camera</p>
        </header>
        
        <div class="main-content">
            <div class="video-container">
                <div class="video-wrapper">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Camera Feed">
                </div>
                <div class="controls">
                    <button class="btn-primary" onclick="toggleDetection()">
                        <span id="toggleText">⏸ Pause Detection</span>
                    </button>
                    <button class="btn-secondary" onclick="refreshPage()">🔄 Refresh</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="info-card">
                    <h2>📊 Statistics</h2>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-label">FPS</div>
                            <div class="stat-value" id="fps">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Objects</div>
                            <div class="stat-value" id="objectCount">0</div>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <span class="status active" id="status">🟢 Active</span>
                    </div>
                </div>
                
                <div class="info-card">
                    <h2>🎯 Current Detections</h2>
                    <div class="detections-list" id="detectionsList">
                        <div class="loading">Waiting for detections...</div>
                    </div>
                </div>
                
                <div class="info-card">
                    <h2>📋 Detectable Classes</h2>
                    <div class="classes-grid" id="classesList">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let detectionActive = true;
        
        // Load model classes
        fetch('/model_info')
            .then(response => response.json())
            .then(data => {
                const classesList = document.getElementById('classesList');
                if (data.classes) {
                    classesList.innerHTML = data.classes
                        .map(cls => `<div class="class-tag">${cls}</div>`)
                        .join('');
                }
            });
        
        // Update detections periodically
        function updateDetections() {
            fetch('/detections')
                .then(response => response.json())
                .then(data => {
                    // Update FPS
                    document.getElementById('fps').textContent = data.fps;
                    
                    // Update object count
                    document.getElementById('objectCount').textContent = data.detections.length;
                    
                    // Update status
                    const statusEl = document.getElementById('status');
                    if (data.active) {
                        statusEl.className = 'status active';
                        statusEl.textContent = '🟢 Active';
                    } else {
                        statusEl.className = 'status inactive';
                        statusEl.textContent = '🔴 Paused';
                    }
                    
                    // Update detections list
                    const detectionsList = document.getElementById('detectionsList');
                    if (data.detections.length === 0) {
                        detectionsList.innerHTML = '<div class="loading">No objects detected</div>';
                    } else {
                        detectionsList.innerHTML = data.detections
                            .map(det => `
                                <div class="detection-item">
                                    <span class="detection-class">${det.class}</span>
                                    <span class="detection-conf">${det.confidence}</span>
                                </div>
                            `)
                            .join('');
                    }
                });
        }
        
        // Toggle detection
        function toggleDetection() {
            fetch('/toggle_detection')
                .then(response => response.json())
                .then(data => {
                    detectionActive = data.active;
                    const toggleText = document.getElementById('toggleText');
                    if (detectionActive) {
                        toggleText.textContent = '⏸ Pause Detection';
                    } else {
                        toggleText.textContent = '▶ Resume Detection';
                    }
                });
        }
        
        // Refresh page
        function refreshPage() {
            location.reload();
        }
        
        // Update detections every 500ms
        setInterval(updateDetections, 500);
        
        // Initial update
        updateDetections();
    </script>
</body>
</html>
